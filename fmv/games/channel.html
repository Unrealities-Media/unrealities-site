<p class="ch-hint" id="ch-hint">Arrow keys or swipe to tune · Enter to go deeper · Esc to go back · T for teletext · I to change input</p>

<div class="ch-set">
  <div class="ch-bezel"><div class="ch-screen" id="screen" aria-live="polite">
    <canvas id="static" width="160" height="120" aria-hidden="true"></canvas>
    <div class="ch-view" id="view"><div class="ch-osd"><div class="ch-num"><small>CH</small>--</div><div class="ch-era"><b>Tuning</b>Loading the database</div></div></div>
  </div></div>
  <div class="ch-remote" aria-label="Remote control">
    <div class="ch-speaker" aria-hidden="true"></div>
    <span class="ch-lbl">Channel</span>
    <div class="ch-pair"><button class="ch-rb" data-k="chdown" aria-label="Previous year">CH-</button><button class="ch-rb" data-k="chup" aria-label="Next year">CH+</button></div>
    <span class="ch-lbl">Select</span>
    <div class="ch-pair"><button class="ch-rb" data-k="up" aria-label="Up">▲</button><button class="ch-rb" data-k="down" aria-label="Down">▼</button></div>
    <button class="ch-rb ok" data-k="ok" aria-label="OK: go deeper">OK</button>
    <button class="ch-rb back" data-k="back" aria-label="Back">BACK</button>
    <button class="ch-rb txt" data-k="txt" aria-label="Teletext">TXT</button>
    <button class="ch-rb input" data-k="input" aria-label="Change input: pick a system">INPUT</button>
  </div>
</div>

<div class="ch-tuner"><div class="ch-dial" id="dial" role="slider" aria-label="Year" tabindex="0"></div></div>

<script src="js/systems.js"></script>
<script src="js/art.js"></script>
